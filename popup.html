<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Lovebug</title><link rel="stylesheet" href="popup.css"></head>
<body><main><div class="eyebrow">A LITTLE LOVE, ALWAYS</div><img src="pet-sitting.png" width="124" height="124" alt="A cream and taupe pixel-art kitten"><h1>Little Lovebug</h1><p class="name" id="name">Lovebug</p><p>A tiny companion. A soft little reminder<br>that you are so very loved.</p><label class="toggle"><span>Show my kitten</span><input id="visible" type="checkbox" role="switch" checked></label><section class="gift-settings" aria-label="Surprise gifts settings"><label class="toggle sub-toggle"><span>Surprise gifts 🎁</span><input id="surpriseGifts" type="checkbox" role="switch" checked></label><div id="giftOptions" class="gift-options"><label class="select-row"><span>Frequency</span><select id="giftFrequency" aria-label="Gift frequency"><option value="rare">Rare (8–16m)</option><option value="normal" selected>Normal (3–6m)</option><option value="frequent">Frequent (2–4m)</option></select></label><label class="toggle sub-toggle-small"><span>Romantic messages</span><input id="giftMessages" type="checkbox" role="switch" checked></label></div></section><div class="quick-actions"><button type="button" id="btnGiftNow" class="btn-action">🎁 Deliver gift</button><button type="button" id="btnToyNow" class="btn-action">🐾 Play with toy</button><button type="button" id="btnPeekNow" class="btn-action btn-action-full">🙈 Play peekaboo</button></div><p id="status" aria-live="polite">With you on ordinary webpages ♡</p></main><script src="popup.js"></script></body></html>
